<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explorateur — Graphes de connaissances</title>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
  --txt:#e6e8ec; --muted:#9aa0ab; --accent:#5dcaa5;
  --numeriques:#7f77dd; --geom:#378add; --mesure:#1d9e75; --prob:#d85a30;
  --framework:#888780; --lc:#d4537e; --task:#c98a1a; --plan:#378add; --cadre:#1d9e75;
  --err:#e0685a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;font-size:14px}
header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px}
header .htext{flex:1;min-width:0}
h1{font-size:18px;font-weight:600}
.sub{color:var(--muted);font-size:13px;margin-top:3px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--muted)}
.chip b{color:var(--txt);font-weight:600}
.hdr-tools{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-top:2px}
.kgsel{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;max-width:260px}
.iconbtn{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:5px 11px;font-size:12px;cursor:pointer;font-weight:600;flex-shrink:0}
.iconbtn:hover{color:var(--txt);border-color:var(--accent)}
.iconbtn:disabled{opacity:.5;cursor:default}
.iconbtn.active{color:var(--accent);border-color:var(--accent)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:8px 14px;border-bottom:1px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.views{display:flex;gap:6px;padding:12px 14px 0;flex-wrap:wrap}
.viewbtn{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:8px 8px 0 0;padding:8px 14px;font-size:13px;cursor:pointer;border-bottom:none}
.viewbtn:hover{color:var(--txt)}
.viewbtn.active{background:var(--panel);color:var(--accent);border-color:var(--accent);border-bottom:1px solid var(--panel)}
.filters{padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel2)}
.filters-head{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.filters-title{font-size:13px;font-weight:600;color:var(--txt)}
.filters-sub{font-size:11px;color:var(--muted)}
.filters-body{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.srcchip{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--txt);font-size:12.5px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:5px 12px}
.srcchip:has(input:checked){border-color:var(--accent);color:var(--accent)}
.srcbox{cursor:pointer;accent-color:var(--accent)}
.filters-actions{margin-left:8px;display:inline-flex;gap:6px}
.minibtn{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer}
.minibtn:hover{color:var(--txt);border-color:var(--accent)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.toolbar input[type=search]{flex:1;min-width:150px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 10px;font-size:13px}
.toolbar button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 11px;font-size:12px;cursor:pointer}
.toolbar button:hover{color:var(--txt);border-color:var(--accent)}
.tree{overflow:auto;padding:14px 14px 80px 14px}
.node{margin:1px 0}
.row{display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:7px;cursor:pointer;user-select:none}
.row:hover{background:var(--panel2)}
.row.sel{background:var(--panel2);outline:1px solid var(--accent)}
.tw{width:16px;text-align:center;color:var(--muted);font-size:11px;flex-shrink:0;cursor:pointer;border-radius:4px}
.tw:hover{background:var(--line);color:var(--txt)}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.code{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;flex-shrink:0}
.lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);flex-shrink:0;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.row.linkrow{opacity:.92}
.row.linkrow .lbl{font-style:italic}
.linktag{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--task);border:1px solid var(--line);border-radius:5px;padding:1px 6px;flex-shrink:0;background:var(--panel2)}
.row.linkrow .tw{color:var(--task)}
.cnt{font-size:11px;color:var(--muted);flex-shrink:0}
.kids{margin-left:16px;border-left:1px solid var(--line);padding-left:2px}
.hidden{display:none !important}
/* states */
.banner{padding:14px 22px;font-size:13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.banner.load{color:var(--muted)}
.banner.err{color:var(--err)}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;flex-shrink:0}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{padding:40px 22px;color:var(--muted);font-size:13px}
/* login */
.loginwrap{display:grid;place-items:center;min-height:70vh;padding:20px}
.logincard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px;width:min(92vw,24rem)}
.logincard h2{font-size:16px;margin-bottom:4px}
.logincard p{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.logincard label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin:12px 0 5px}
.logincard input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:9px 11px;font-size:14px}
.logincard button{width:100%;margin-top:16px;padding:10px;border:0;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer;background:var(--accent);color:#08130e}
.loginerr{color:var(--err);font-size:12px;margin-top:10px;min-height:1.2em}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(6,8,12,.66);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.overlay.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:640px;width:100%;max-height:86vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.modal-head{padding:18px 20px 14px;border-bottom:1px solid var(--line);position:relative}
.modal-head h2{font-size:16px;line-height:1.35;padding-right:34px}
.modal-head .meta{margin-top:8px}
.tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);margin-right:5px;margin-bottom:4px}
.close{position:absolute;top:14px;right:14px;width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-size:16px;line-height:1;cursor:pointer}
.close:hover{color:var(--txt);border-color:var(--accent)}
.modal-body{overflow:auto;padding:6px 20px 20px}
.sect{margin-top:16px}
.sect h3{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px}
.sect h3 .n{color:var(--accent)}
.rel{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin:6px 0;font-size:13px;cursor:pointer}
.rel:hover{border-color:var(--accent)}
.rel.static{cursor:default}
.rel .rt{color:var(--accent);font-weight:600;font-size:11px}
.rel .rc{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.rel .rd{color:var(--txt);margin-top:3px;line-height:1.45}
.ex{font-size:12.5px;color:var(--muted);background:var(--panel2);border-radius:9px;padding:9px 11px;margin-top:6px;border-left:2px solid var(--accent);line-height:1.5}
.ctxgrid{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.ctxk{color:var(--muted)}
.ctxv{color:var(--txt)}
.hint{color:var(--muted);font-size:12px;padding:2px 14px 12px}
</style>
</head>
<body>
<header>
  <div class="htext">
    <h1 id="mainTitle">Explorateur — Graphes de connaissances</h1>
    <div class="sub" id="mainSub">Sénégal · MOHEBS — ontologie Learning Commons · lecture seule (graphe publié)</div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="hdr-tools">
    <select class="kgsel hidden" id="kgSelect" title="Choisir un graphe / Choose a knowledge graph"></select>
    <button class="iconbtn hidden" id="refreshBtn" title="Rafraîchir / Refresh">↻</button>
    <button class="iconbtn" id="langToggle" title="Switch language / Changer de langue">EN</button>
  </div>
</header>

<!-- transient states -->
<div class="banner load hidden" id="banner"><span class="spin" id="bannerSpin"></span><span id="bannerText"></span></div>

<!-- login gate -->
<div class="loginwrap hidden" id="loginWrap">
  <div class="logincard">
    <h2 id="loginTitle">Connexion</h2>
    <p id="loginSub">Connectez-vous avec votre compte MOHEBS. <br><small>Sign in with your MOHEBS account.</small></p>
    <label id="loginEmailLbl" for="loginEmail">Email</label>
    <input id="loginEmail" type="email" autocomplete="username">
    <label id="loginPwLbl" for="loginPw">Mot de passe</label>
    <input id="loginPw" type="password" autocomplete="current-password">
    <button id="loginBtn">Se connecter</button>
    <div class="loginerr" id="loginErr"></div>
  </div>
</div>

<!-- app body (revealed once a graph loads) -->
<div id="app" class="hidden">
  <div class="legend" id="legend"></div>
  <div class="views" id="views"></div>
  <div class="filters hidden" id="filters">
    <div class="filters-head">
      <span class="filters-title" id="fTitle">Filtres</span>
      <span class="filters-sub" id="fSub">Sources — sélection multiple</span>
    </div>
    <div class="filters-body" id="filtersBody"></div>
  </div>
  <div class="toolbar">
    <input type="search" id="q" placeholder="Rechercher un nœud…">
    <button id="expandAll">Tout déplier</button>
    <button id="collapseAll">Tout replier</button>
  </div>
  <div class="hint" id="hintDiv"></div>
  <div class="tree" id="tree"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <div class="modal-head">
      <button class="close" id="closeBtn" aria-label="Fermer">×</button>
      <h2 id="m-title"></h2>
      <div class="meta" id="m-meta"></div>
    </div>
    <div class="modal-body" id="m-body"></div>
  </div>
</div>

<script>
// ── Config: API base. Empty = same-origin (Firebase Hosting rewrites /kg → Cloud
// Run). Override with ?api=http://localhost:8791 for local/direct testing (CORS). ──
const API = (new URLSearchParams(location.search).get("api") || "").replace(/\/+$/,"");
const el = (id) => document.getElementById(id);

// ── i18n (UI chrome only; content is bilingual in the data) ──────────────────
let LANG = 'fr';
const UI = {
  fr: {
    sub:"Sénégal · MOHEBS — ontologie Learning Commons · lecture seule (graphe publié)",
    filtres:'Filtres', sourcesSub:'Sources — sélection multiple', tout:'Tout', aucune:'Aucune',
    search:'Rechercher un nœud…', expandAll:'Tout déplier', collapseAll:'Tout replier',
    noeuds:'nœuds', relations:'relations', taches:'tâches',
    loading:'Chargement du graphe…', loadingNs:'Chargement des graphes…',
    empty:'Ce graphe ne contient aucun nœud.',
    errServer:'Impossible de joindre le serveur.', errLoad:'Échec du chargement du graphe.',
    retry:'Réessayer', signin:'Se connecter', loginFail:'Échec de la connexion : ',
    hintGrouped:'Cliquez sur un nœud pour ouvrir sa fiche ; le triangle déplie/replie. Vue en lecture seule du graphe publié.',
    hintGeneric:'Vue générique : chaque type de nœud, puis ses nœuds, puis leurs relations sortantes. Cliquez pour ouvrir une fiche.',
    contexte:'Contexte', os_label:'Objectif spécifique (OS)', exemples:'Exemples',
    statut_label:'Statut', source_label:'Source', adaptation:'Adaptation', progression:'Progression',
    domaineLbl:'Domaine', palierLbl:'Palier', semaineLbl:'Semaine', chapitreLbl:'Chapitre',
    strandLbl:'Composante', genreLbl:'Genre',
    parent:'Parent', children:'Enfants', prepTo:'Prépare à (buildsTowards →)', builtFrom:'Construit à partir de (buildsTowards ←)',
    outRel:'Relations sortantes', noRel:'Aucune relation supplémentaire.',
  },
  en: {
    sub:"Senegal · MOHEBS — Learning Commons ontology · read-only (published graph)",
    filtres:'Filters', sourcesSub:'Sources — multi-select', tout:'All', aucune:'None',
    search:'Search for a node…', expandAll:'Expand all', collapseAll:'Collapse all',
    noeuds:'nodes', relations:'relationships', taches:'tasks',
    loading:'Loading graph…', loadingNs:'Loading knowledge graphs…',
    empty:'This graph contains no nodes.',
    errServer:'Could not reach the server.', errLoad:'Failed to load the graph.',
    retry:'Retry', signin:'Sign in', loginFail:'Sign-in failed: ',
    hintGrouped:'Click a node to open its detail panel; the triangle expands / collapses. Read-only view of the published graph.',
    hintGeneric:'Generic view: each node type, then its nodes, then their outgoing relationships. Click to open a detail panel.',
    contexte:'Context', os_label:'Learning Objective (LO)', exemples:'Examples',
    statut_label:'Status', source_label:'Source', adaptation:'Adaptation', progression:'Progression',
    domaineLbl:'Domain', palierLbl:'Tier', semaineLbl:'Week', chapitreLbl:'Chapter',
    strandLbl:'Strand', genreLbl:'Genre',
    parent:'Parent', children:'Children', prepTo:'Prepares for (buildsTowards →)', builtFrom:'Built from (buildsTowards ←)',
    outRel:'Outgoing relationships', noRel:'No additional relationships.',
  }
};
const t = (k) => (UI[LANG][k] ?? UI.fr[k] ?? k);
const L = (o) => (o ? (LANG==='en' ? (o.en||o.fr) : o.fr) : '');

// ── Live state ───────────────────────────────────────────────────────────────
let supa = null;                 // supabase client when auth is required
let NAMESPACES = [];             // selector list
let currentNs = null;
let DATA = null;                 // { nodes, edges, meta }
let TAXO = {};                   // category key → { label, color }  (from meta.taxonomy)
let N = {};                      // id → node
let currentView = null;          // view id
let sourceOn = {};               // srcKey → bool
const groupCache = {};           // viewId → { roots:[], childrenOf:{synthId:[ids]} }
let selected = null;
const expanded = new Set();

// indexes rebuilt per graph
let outByRel = {};   // r → from → [{to,o}]
let inHasChild = {}; // to → from   (hasChild parent)
let btOut = {};      // buildsTowards from → [to]
let btIn = {};       // buildsTowards to → [from]
let anyIncoming = new Set();

function desc(n){ return LANG==='en' ? (n.desc_en||n.desc) : n.desc; }

// ── Boot ─────────────────────────────────────────────────────────────────────
async function boot(){
  showBanner('load', t('loadingNs'));
  let cfg;
  try { cfg = await (await fetch(API+"/kg/config")).json(); }
  catch(e){ showFatal(t('errServer')+" ("+(API||location.origin)+")"); return; }
  if (cfg.authRequired){
    const ok = await ensureLogin(cfg);
    if (!ok) return;             // login form is showing; boot resumes after sign-in
  }
  await loadNamespaces();
}

// ── Auth (Supabase, optional) ────────────────────────────────────────────────
async function ensureLogin(cfg){
  const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
  supa = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  const { data:{ session } } = await supa.auth.getSession();
  if (session) return true;
  hideBanner();
  el('loginWrap').classList.remove('hidden');
  return await new Promise((resolve) => {
    const attempt = async () => {
      el('loginErr').textContent = "";
      const { error } = await supa.auth.signInWithPassword({ email: el('loginEmail').value.trim(), password: el('loginPw').value });
      if (error){ el('loginErr').textContent = t('loginFail') + error.message; return; }
      el('loginWrap').classList.add('hidden');
      resolve(true);
    };
    el('loginBtn').onclick = attempt;
    el('loginPw').onkeydown = (e) => { if (e.key === 'Enter') attempt(); };
  });
}
async function authHeaders(){
  if (!supa) return {};
  const { data:{ session } } = await supa.auth.getSession();
  return session ? { Authorization: "Bearer " + session.access_token } : {};
}
async function apiGet(path){
  const r = await fetch(API+path, { headers: await authHeaders() });
  if (!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}

// ── Namespaces + selector ────────────────────────────────────────────────────
async function loadNamespaces(){
  try {
    const { namespaces } = await apiGet("/kg/namespaces");
    NAMESPACES = namespaces || [];
  } catch(e){ showFatal(t('errServer')); return; }
  if (!NAMESPACES.length){ showFatal(t('empty')); return; }
  const sel = el('kgSelect');
  sel.innerHTML = "";
  NAMESPACES.forEach(ns => { const o=document.createElement('option'); o.value=ns.ns; o.textContent=L(ns.label); sel.appendChild(o); });
  sel.classList.remove('hidden');
  el('refreshBtn').classList.remove('hidden');
  sel.onchange = () => loadGraph(sel.value);
  el('refreshBtn').onclick = () => loadGraph(currentNs, true);
  await loadGraph(NAMESPACES[0].ns);
}

// ── Load + index one graph ───────────────────────────────────────────────────
async function loadGraph(ns, isRefresh){
  currentNs = ns;
  el('kgSelect').value = ns;
  el('refreshBtn').disabled = true;
  showBanner('load', isRefresh ? '↻ ' + t('loading') : t('loading'));
  el('app').classList.add('hidden');
  let g;
  try { g = await apiGet("/kg?ns="+encodeURIComponent(ns)); }
  catch(e){ el('refreshBtn').disabled=false; showFatal(t('errLoad'), () => loadGraph(ns, true)); return; }
  DATA = g;
  buildIndexes();
  buildUIForGraph();
  hideBanner();
  el('refreshBtn').disabled = false;
  if (!DATA.nodes.length){ el('app').classList.add('hidden'); showFatal(t('empty')); return; }
  el('app').classList.remove('hidden');
  render();
}

function buildIndexes(){
  N = {}; DATA.nodes.forEach(n => N[n.id]=n);
  outByRel = {}; inHasChild = {}; btOut = {}; btIn = {}; anyIncoming = new Set();
  Object.keys(groupCache).forEach(k => delete groupCache[k]);
  DATA.edges.forEach(e => {
    (outByRel[e.r] = outByRel[e.r] || {});
    (outByRel[e.r][e.s] = outByRel[e.r][e.s] || []).push({ to:e.t, o:e.o||0, rel:e.rel||e.r });
    anyIncoming.add(e.t);
    if (e.r === 'hasChild') inHasChild[e.t] = e.s;
    if (e.r === 'buildsTowards'){ (btOut[e.s]=btOut[e.s]||[]).push(e.t); (btIn[e.t]=btIn[e.t]||[]).push(e.s); }
  });
  // sort each adjacency by order hint
  for (const r in outByRel) for (const s in outByRel[r]) outByRel[r][s].sort((a,b)=>a.o-b.o);
}
function outTargets(id, rel){ return (outByRel[rel]?.[id] || []).map(x => x.to); }

// ── UI for a freshly loaded graph ────────────────────────────────────────────
function buildUIForGraph(){
  // legend/colour taxonomy — server-declared, graph-agnostic (no hardcoded kinds)
  TAXO = {}; (DATA.meta.taxonomy || []).forEach(x => { TAXO[x.key] = x; });
  // source-filter chips — DERIVED from the srcKeys present in the data
  sourceOn = {};
  const body = el('filtersBody'); body.innerHTML = "";
  const sources = DATA.meta.sources || [];
  if (sources.length){
    sources.forEach(k => {
      sourceOn[k] = true;
      const lab = document.createElement('label'); lab.className='srcchip';
      lab.innerHTML = '<input type="checkbox" class="srcbox" checked> ' + esc(k);
      lab.querySelector('input').onchange = (e) => { sourceOn[k]=e.target.checked; el('q').value=''; render(); };
      body.appendChild(lab);
    });
    const act = document.createElement('span'); act.className='filters-actions';
    const all=document.createElement('button'); all.className='minibtn'; all.textContent=t('tout'); all.onclick=()=>setAllSources(true);
    const none=document.createElement('button'); none.className='minibtn'; none.textContent=t('aucune'); none.onclick=()=>setAllSources(false);
    act.append(all,none); body.appendChild(act);
    el('filters').classList.remove('hidden');
  } else {
    el('filters').classList.add('hidden');
  }
  // view tabs — DRIVEN by meta.viewConfig
  const views = DATA.meta.viewConfig.views;
  currentView = views[0]?.id ?? null;
  const vc = el('views'); vc.innerHTML = "";
  views.forEach(v => {
    const b = document.createElement('button');
    b.className = 'viewbtn' + (v.id===currentView ? ' active':'');
    b.textContent = L(v.label); b.dataset.view = v.id;
    b.onclick = () => {
      currentView = v.id;
      [...vc.children].forEach(x=>x.classList.remove('active')); b.classList.add('active');
      el('q').value=''; expanded.clear(); render();
    };
    vc.appendChild(b);
  });
  buildLegend();
  updateChrome();
  expanded.clear();
}
function setAllSources(v){
  document.querySelectorAll('.srcbox').forEach(b=>b.checked=v);
  Object.keys(sourceOn).forEach(k=>sourceOn[k]=v);
  el('q').value=''; render();
}
function viewSpec(id){ return DATA.meta.viewConfig.views.find(v=>v.id===id); }

// ── View derivation ──────────────────────────────────────────────────────────
const isSynth = (id) => typeof id==='string' && (id.startsWith('grp:') || id.startsWith('kind:'));
function synthMeta(id){ return groupCache.__meta?.[id] || null; }

function srcAllowed(id){
  if (isSynth(id)) return true;                 // group/kind nodes never filtered directly
  const n = N[id]; if (!n) return true;
  if (!n.srcKey) return true;                   // untagged (chapters, lessons, structure)
  return sourceOn[n.srcKey] !== false;
}

// Build (and cache) a grouped-spine view: nested groups from `groupBy` props read
// off `anchorKind` nodes, then the anchors, then the hasChild subtree.
function buildGroupedSpine(spec){
  if (groupCache[spec.id]) return groupCache[spec.id];
  const meta = (groupCache.__meta = groupCache.__meta || {});
  const childrenOf = {};
  const anchors = DATA.nodes.filter(n => n.kind === spec.params.anchorKind);
  const levels = spec.params.groupBy;
  const order = spec.params.order || null;

  // recursively nest anchors by the groupBy levels
  function nest(items, depth, prefix){
    if (depth >= levels.length){
      return items.slice().sort((a,b)=> (a.ord??0)-(b.ord??0) || String(a.code).localeCompare(String(b.code),undefined,{numeric:true}))
                  .map(n=>n.id);
    }
    const lvl = levels[depth];
    const buckets = new Map();
    items.forEach(n => { const v = n[lvl.key]; const key=String(v??''); if(!buckets.has(key)) buckets.set(key,[]); buckets.get(key).push(n); });
    let keys = [...buckets.keys()];
    keys.sort((a,b)=>{
      if (order){ const ia=order.indexOf(a), ib=order.indexOf(b); if(ia>=0||ib>=0) return (ia<0?1e9:ia)-(ib<0?1e9:ib); }
      const na=Number(a), nb=Number(b);
      if(!isNaN(na)&&!isNaN(nb)) return na-nb;
      return a.localeCompare(b);
    });
    const ids = [];
    keys.forEach(k => {
      const sid = 'grp:'+spec.id+':'+prefix+k;
      const label = lvl.labelFr ? { fr:(lvl.labelFr+' '+k), en:((lvl.labelEn||lvl.labelFr)+' '+k) } : { fr:k||'—', en:k||'—' };
      meta[sid] = { label, level: lvl.key, value:k };
      childrenOf[sid] = nest(buckets.get(k), depth+1, prefix+k+'/');
      ids.push(sid);
    });
    return ids;
  }
  const roots = nest(anchors, 0, '');
  const res = { roots, childrenOf };
  groupCache[spec.id] = res;
  return res;
}

// Generic node-type view: a synthetic node per kind → its nodes → outgoing edges.
function buildNodeType(){
  if (groupCache.__nodetype) return groupCache.__nodetype;
  const meta = (groupCache.__meta = groupCache.__meta || {});
  const byKind = {};
  DATA.nodes.forEach(n => (byKind[n.kind]=byKind[n.kind]||[]).push(n.id));
  const roots = Object.keys(byKind).sort();
  const childrenOf = {};
  roots.forEach(k => {
    const sid = 'kind:'+k;
    meta[sid] = { label:{ fr:k, en:k }, kindRoot:true };
    childrenOf[sid] = byKind[k].slice().sort((a,b)=> (N[a].ord??0)-(N[b].ord??0) || String(N[a].code).localeCompare(String(N[b].code),undefined,{numeric:true}));
  });
  const res = { roots: roots.map(k=>'kind:'+k), childrenOf };
  groupCache.__nodetype = res;
  return res;
}

function viewRoots(){
  const spec = viewSpec(currentView);
  if (!spec) return [];
  if (spec.shape === 'grouped-spine') return buildGroupedSpine(spec).roots;
  return buildNodeType().roots;
}
function viewChildren(id){
  const spec = viewSpec(currentView);
  if (!spec) return [];
  if (spec.shape === 'grouped-spine'){
    const gs = buildGroupedSpine(spec);
    if (isSynth(id)) return (gs.childrenOf[id]||[]).filter(srcAllowed);
    const n = N[id]; if (!n) return [];
    if (spec.params.stopKind && n.kind === spec.params.stopKind) return [];
    return outTargets(id, spec.params.expandEdge).filter(srcAllowed);
  }
  // node-type
  const nt = buildNodeType();
  if (isSynth(id)) return (nt.childrenOf[id]||[]).filter(srcAllowed);
  // real node → outgoing edges (any relation) as link rows
  const out = [];
  for (const r in outByRel) for (const x of (outByRel[r][id]||[])) if (srcAllowed(x.to)) out.push({ id:x.to, rel:r });
  return out.map(o=>o.id);   // link relation resolved again at render for the tag
}
// The REAL relation linking `parent`→`childId` (for the link badge). `outByRel` is
// keyed by the traversal type (folded to hasChild), so we read the true type off the
// stored adjacency entry — a folded supports/hasEducationalAlignment/hasPart, or a
// metadata-derived "illustrates", reads as itself, not a blanket hasChild.
function relBetween(parentId, childId){
  for (const r in outByRel){ const hit=(outByRel[r][parentId]||[]).find(x=>x.to===childId); if(hit) return hit.rel||r; }
  return null;
}

// ── Colour + labels ──────────────────────────────────────────────────────────
// Colour is driven entirely by the server taxonomy (node.cat), so the palette is
// the same across every graph. Synthetic grouping rows borrow the colour of the
// category they bucket by (e.g. a reading strand group → the strand colour).
function colorFor(id){
  if (isSynth(id)){
    const m = synthMeta(id);
    if (m?.kindRoot) return 'var(--framework)';   // raw node-type groups
    const tx = m?.level && TAXO[m.level];          // grouped-spine bucket
    return tx ? tx.color : 'var(--plan)';          // palier/other groups → neutral
  }
  const n = N[id]; if (!n) return 'var(--muted)';
  const tx = n.cat && TAXO[n.cat];
  return tx ? tx.color : 'var(--muted)';
}
function nodeLabel(id){
  if (isSynth(id)) return L(synthMeta(id).label);
  const n = N[id]; let d = desc(n)||n.code||'';
  return d.length>84 ? d.slice(0,82)+'…' : d;
}

// ── Legend ───────────────────────────────────────────────────────────────────
// Rendered straight from the server-declared taxonomy — one swatch per category
// actually present, in canonical order. No subject vocabulary is hardcoded here.
function buildLegend(){
  const taxo = DATA.meta.taxonomy || [];
  el('legend').innerHTML = taxo.map(tx =>
    '<span><i class="dot" style="background:'+esc(tx.color)+'"></i><em>'+esc(L(tx.label))+'</em></span>'
  ).join('');
}

// ── Render tree ──────────────────────────────────────────────────────────────
const tree = el('tree');
function render(){
  tree.innerHTML='';
  el('hintDiv').textContent = viewSpec(currentView)?.shape==='node-type' ? t('hintGeneric') : t('hintGrouped');
  viewRoots().forEach(r => tree.appendChild(renderNode(r, null)));
  renderStats();
}
function renderNode(id, parentId){
  const synthetic = isSynth(id);
  const kids = viewChildren(id);
  const hasKids = kids.length>0;
  const wrap = document.createElement('div'); wrap.className='node';
  // Show the real relation as a badge. In the node-type view every link is a
  // relation, so badge them all. In the containment hierarchy, badge only the
  // non-obvious folded edges (hasPart / supports / hasEducationalAlignment /
  // illustrates / buildsTowards / relatesTo) and leave a genuine hasChild clean.
  const rawRel = (!synthetic && parentId && !isSynth(parentId)) ? relBetween(parentId, id) : null;
  const linkRel = rawRel && (viewSpec(currentView).shape==='node-type' || rawRel!=='hasChild') ? rawRel : null;
  const row = document.createElement('div'); row.className='row'+(selected===id?' sel':'')+(linkRel?' linkrow':'');
  const tw = document.createElement('span'); tw.className='tw'; tw.textContent = hasKids ? (expanded.has(id)?'▾':'▸') : '';
  if (hasKids) tw.onclick = (e)=>{ e.stopPropagation(); toggle(id); };
  const dot = document.createElement('span'); dot.className='dot'; dot.style.background = colorFor(id);
  row.append(tw, dot);
  if (linkRel){ const lt=document.createElement('span'); lt.className='linktag'; lt.textContent=linkRel; row.appendChild(lt); }
  const code = document.createElement('span'); code.className='code'; code.textContent = synthetic?'':(N[id].code||''); row.appendChild(code);
  const lbl = document.createElement('span'); lbl.className='lbl'; lbl.textContent = nodeLabel(id); lbl.title = synthetic?nodeLabel(id):(desc(N[id])||''); row.appendChild(lbl);
  if (hasKids){ const c=document.createElement('span'); c.className='cnt'; c.textContent=kids.length; row.appendChild(c); }
  if (!synthetic) row.onclick = ()=>openModal(id);
  else row.onclick = ()=>{ if (hasKids) toggle(id); };
  wrap.appendChild(row);
  if (hasKids){
    const kc = document.createElement('div'); kc.className='kids'+(expanded.has(id)?'':' hidden');
    kids.forEach(k => kc.appendChild(renderNode(k, id)));
    wrap.appendChild(kc);
  }
  return wrap;
}
function toggle(id){ if(expanded.has(id))expanded.delete(id); else expanded.add(id); render(); }

// ── Stats ────────────────────────────────────────────────────────────────────
function renderStats(){
  const vis = DATA.nodes.filter(n=>srcAllowed(n.id));
  const visIds = new Set(vis.map(n=>n.id));
  const byCat = {}; vis.forEach(n=>{ if(n.cat) byCat[n.cat]=(byCat[n.cat]||0)+1; });
  const edgeCount = DATA.edges.filter(e=>visIds.has(e.s)&&visIds.has(e.t)).length;
  const chips = ['<span class="chip"><b>'+vis.length+'</b> '+t('noeuds')+'</span>'];
  // one chip per taxonomy category present, labelled + ordered by the taxonomy
  (DATA.meta.taxonomy||[]).forEach(tx=>{ if(byCat[tx.key]) chips.push('<span class="chip"><b>'+byCat[tx.key]+'</b> '+esc(L(tx.label))+'</span>'); });
  chips.push('<span class="chip"><b>'+edgeCount+'</b> '+t('relations')+'</span>');
  el('stats').innerHTML = chips.join('');
}

// ── Modal ────────────────────────────────────────────────────────────────────
const overlay = el('overlay');
function relBlock(title, ids, dir){
  if(!ids||!ids.length) return '';
  let h='<div class="sect"><h3>'+title+' <span class="n">('+ids.length+')</span></h3>';
  ids.forEach(tid=>{ const x=N[tid]; if(!x) return;
    h+='<div class="rel" onclick="openModal(\''+tid+'\')"><span class="rt">'+dir+'</span>'
      +(x.code?' <span class="rc">'+esc(x.code)+'</span>':'')+'<div class="rd">'+esc(desc(x)||'')+'</div></div>';
  });
  return h+'</div>';
}
function openModal(id){
  const n = N[id]; if(!n) return;
  selected = id;
  el('m-title').textContent = desc(n) || n.code || n.label;
  let meta = '<span class="tag">'+esc(n.label)+'</span>';
  const stShow = LANG==='en'?(n.st_en||n.st):n.st;
  if (n.nt) meta += '<span class="tag">'+esc(n.nt)+'</span>';
  if (stShow) meta += '<span class="tag">'+esc(stShow)+'</span>';
  if (n.code) meta += '<span class="tag">'+esc(n.code)+'</span>';
  if (n.srcKey) meta += '<span class="tag">'+esc(n.srcKey)+'</span>';
  el('m-meta').innerHTML = meta;

  let h='';
  // Generic Learning-Commons properties — the node's raw property bag rendered
  // key/value, so the panel follows the ontology and never hardcodes subject
  // fields. Boilerplate provenance keys (shown as header tags or just noise) skip.
  const SKIP = new Set(['identifier','license','attribution_statement','provider','source_key','normalized_type','normalized_statement_type','statement_type','description','statement_code']);
  const props = n.props || {};
  const rows = Object.keys(props)
    .filter(k => !SKIP.has(k))
    .map(k => [k, props[k]])
    .filter(([,v]) => v!=null && v!=='' && !(Array.isArray(v) && v.length===0));
  if (rows.length){
    h+='<div class="sect"><h3>'+(LANG==='en'?'Properties':'Propriétés')+'</h3><div class="ctxgrid">';
    rows.forEach(([k,v])=>{ const disp = Array.isArray(v)?v.join(', '):(typeof v==='object'?JSON.stringify(v):String(v)); h+='<div class="ctxk">'+esc(String(k))+'</div><div class="ctxv">'+esc(disp)+'</div>'; });
    h+='</div></div>';
  }

  // relationships from the stored spine (published only)
  if (inHasChild[id]) h+=relBlock(t('parent'), [inHasChild[id]], 'parent');
  const kids = outTargets(id,'hasChild'); if (kids.length) h+=relBlock(t('children'), kids, 'hasChild');
  if (btOut[id]) h+=relBlock(t('prepTo'), btOut[id], 'buildsTowards');
  if (btIn[id]) h+=relBlock(t('builtFrom'), btIn[id], 'from');

  if (!h) h='<div class="hint" style="padding:24px 0">'+t('noRel')+'</div>';
  el('m-body').innerHTML=h; el('m-body').scrollTop=0;
  overlay.classList.add('open');
  let p = inHasChild[id]; while(p){ expanded.add(p); p=inHasChild[p]; }
  render();
}
window.openModal = openModal;
function closeModal(){ overlay.classList.remove('open'); }
el('closeBtn').onclick = closeModal;
overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

// ── Search / expand / collapse ───────────────────────────────────────────────
el('q').addEventListener('input', e=>{
  const q = e.target.value.toLowerCase().trim();
  if (!q){ render(); return; }
  // map every view node to its view-parent, so a match can reveal its ancestors
  const vparent = {};
  const walk = (id)=>{ const s2=new Set(); (function w(id){ if(s2.has(id))return; s2.add(id); viewChildren(id).forEach(c=>{ vparent[c]=id; w(c); }); })(id); };
  viewRoots().forEach(walk);
  const keep = new Set();
  const match = (n)=> (n.desc||'').toLowerCase().includes(q)||(n.desc_en||'').toLowerCase().includes(q)||(n.code||'').toLowerCase().includes(q);
  DATA.nodes.forEach(n=>{ if(match(n)){ keep.add(n.id); let p=vparent[n.id]; while(p){ keep.add(p); expanded.add(p); p=vparent[p]; } } });
  tree.innerHTML='';
  viewRoots().forEach(r=>{ const elx=renderFiltered(r,keep,q); if(elx) tree.appendChild(elx); });
});
function renderFiltered(id, keep, q){
  if (!keep.has(id)) return null;
  const synthetic = isSynth(id);
  const kids = viewChildren(id).filter(k=>keep.has(k));
  const wrap=document.createElement('div'); wrap.className='node';
  const row=document.createElement('div'); row.className='row';
  const hit = !synthetic && ((N[id].desc||'').toLowerCase().includes(q)||(N[id].desc_en||'').toLowerCase().includes(q)||(N[id].code||'').toLowerCase().includes(q));
  const tw=document.createElement('span'); tw.className='tw'; tw.textContent=kids.length?'▾':'';
  const dot=document.createElement('span'); dot.className='dot'; dot.style.background=colorFor(id);
  const code=document.createElement('span'); code.className='code'; code.textContent=synthetic?'':(N[id].code||'');
  const lbl=document.createElement('span'); lbl.className='lbl'; lbl.textContent=nodeLabel(id); if(hit) lbl.style.color='var(--accent)';
  row.append(tw,dot,code,lbl);
  if(!synthetic) row.onclick=()=>openModal(id);
  wrap.appendChild(row);
  if(kids.length){ const kc=document.createElement('div'); kc.className='kids'; kids.forEach(k=>{ const e2=renderFiltered(k,keep,q); if(e2)kc.appendChild(e2); }); wrap.appendChild(kc); }
  return wrap;
}
function allViewNodes(){ const s=new Set(); const seen=new Set(); viewRoots().forEach(r=>(function w(id){ if(seen.has(id))return; seen.add(id); s.add(id); viewChildren(id).forEach(w); })(r)); return s; }
el('expandAll').onclick = ()=>{ allViewNodes().forEach(id=>{ if(viewChildren(id).length) expanded.add(id); }); render(); };
el('collapseAll').onclick = ()=>{ expanded.clear(); render(); };

// ── Chrome / language ────────────────────────────────────────────────────────
function updateChrome(){
  el('mainSub').textContent = t('sub');
  el('fTitle').textContent = t('filtres');
  el('fSub').textContent = t('sourcesSub');
  el('q').placeholder = t('search');
  el('expandAll').textContent = t('expandAll');
  el('collapseAll').textContent = t('collapseAll');
  el('langToggle').textContent = LANG==='fr'?'EN':'FR';
  document.documentElement.lang = LANG;
  // re-label view tabs + selector + legend to the active language
  if (DATA){
    const views = DATA.meta.viewConfig.views;
    [...el('views').children].forEach(b=>{ const v=views.find(x=>x.id===b.dataset.view); if(v) b.textContent=L(v.label); });
    [...el('kgSelect').options].forEach((o,i)=>{ const ns=NAMESPACES.find(x=>x.ns===o.value); if(ns) o.textContent=L(ns.label); });
    buildLegend();
  }
}
el('langToggle').onclick = ()=>{
  LANG = LANG==='fr'?'en':'fr';
  updateChrome();
  if (DATA){ render(); if (selected && overlay.classList.contains('open')) openModal(selected); }
};

// ── Banner / states ──────────────────────────────────────────────────────────
function showBanner(kind, text){ const b=el('banner'); b.className='banner '+kind; el('bannerSpin').style.display = kind==='load'?'':'none'; el('bannerText').innerHTML=esc(text); b.classList.remove('hidden'); }
function hideBanner(){ el('banner').classList.add('hidden'); }
function showFatal(text, retry){
  const b=el('banner'); b.className='banner err'; el('bannerSpin').style.display='none';
  el('bannerText').innerHTML = esc(text) + (retry?' <button class="minibtn" id="__retry">'+t('retry')+'</button>':'');
  b.classList.remove('hidden');
  if (retry) el('__retry').onclick = retry;
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

boot();
</script>
</body>
