site_name: Guide utilisateur — TLM
site_description: Comment utiliser les outils TLM pour créer du matériel pédagogique, modifier le graphe de connaissances, et explorer le curriculum.
docs_dir: docs

theme:
  name: material
  language: fr
  palette:
    - scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Passer en mode sombre
    - scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Passer en mode clair
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest

plugins:
  - search
  # Bilingual FR (default) / EN with a language switcher in the header.
  # English pages are the same filename with a `.en.md` suffix (e.g. index.en.md).
  - i18n:
      docs_structure: suffix
      languages:
        - locale: fr
          name: Français
          default: true
        - locale: en
          name: English
          nav_translations:
            Accueil: Home
            Prise en main: Getting started
            Construire le curriculum: Build the curriculum
            Créer un graphe de connaissances: Create a knowledge graph
            Construire les standards et les composants: Build standards & components
            Concevoir les cours et les gabarits: Design courses & templates
            Ajouter et modifier un cours et ses leçons: Add & edit a course and its lessons
            Créer des routines pédagogiques: Create instructional routines
            Créer des formatters: Create formatters
            Produire et publier: Produce & publish
            Générer du matériel pédagogique: Generate teaching materials
            Relire, publier ou abandonner un brouillon: Review, publish or discard a draft
            Explorer le graphe: Explore the graph
            Administration et développement: Administration & development
            Ajouter un espace de travail ou une matière: Add a workspace or a subject
            Référence: Reference

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Accueil: index.md
  - Prise en main: getting-started.md
  - Construire le curriculum:
      - Créer un graphe de connaissances: create-graph.md
      - Construire les standards et les composants: build-standards.md
  - Concevoir les cours et les gabarits:
      - Ajouter et modifier un cours et ses leçons: courses-lessons.md
      - Créer des routines pédagogiques: routines.md
      - Créer des formatters: formatters.md
  - Produire et publier:
      - Générer du matériel pédagogique: create-materials.md
      - Relire, publier ou abandonner un brouillon: review-approve.md
  - Explorer le graphe: explorer.md
  - Administration et développement:
      - Ajouter un espace de travail ou une matière: admin-developer.md
  - Référence: reference.md
